<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Fullscreen Zoom</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <h1>영상 배율 조정</h1>
      <p class="description">YouTube 영상 확대, 축소, 위치 이동 기능을 설정합니다.</p>

      <label class="field" for="zoomRange">
        <span>배율</span>
        <output id="zoomValue" for="zoomRange">100%</output>
      </label>

      <input id="zoomRange" type="range" min="50" max="150" step="1" value="100">

      <div class="presets">
        <button type="button" data-zoom="80">80%</button>
        <button type="button" data-zoom="90">90%</button>
        <button type="button" data-zoom="100">100%</button>
        <button type="button" data-zoom="110">110%</button>
        <button type="button" data-zoom="120">120%</button>
      </div>

      <label class="toggle">
        <input id="enableToggle" type="checkbox" checked>
        <span>확장프로그램 켜기</span>
      </label>

      <label class="toggle toggle-column">
        <span class="toggle-copy">
          <strong>로그아웃 방지</strong>
          <small>계정 메뉴의 로그아웃 버튼을 흐리게 만들고 실수 클릭을 줄입니다.</small>
        </span>
        <input id="logoutGuardToggle" type="checkbox">
      </label>

      <label class="toggle toggle-column">
        <span class="toggle-copy">
          <strong>자동 음소거 방어</strong>
          <small>m 키나 음소거 버튼을 누른 경우 외에는 YouTube의 음소거/볼륨 0 변경을 차단합니다.</small>
        </span>
        <input id="muteGuardToggle" type="checkbox" checked>
      </label>

      <label class="toggle toggle-column">
        <span class="toggle-copy">
          <strong>썸네일 미리보기 무음</strong>
          <small>마우스를 올렸을 때 재생되는 썸네일 미리보기 영상은 항상 무음으로 유지합니다.</small>
        </span>
        <input id="previewMuteToggle" type="checkbox" checked>
      </label>

      <label class="toggle toggle-column">
        <span class="toggle-copy">
          <strong>이어서 시청 팝업 방어</strong>
          <small>YouTube가 재생을 멈추고 확인창을 띄우면 자동으로 이어서 시청을 누릅니다.</small>
        </span>
        <input id="pauseGuardToggle" type="checkbox" checked>
      </label>

      <label class="toggle toggle-column">
        <span class="toggle-copy">
          <strong>다음 재생 큐</strong>
          <small>추천 영상 카드의 다음 버튼을 눌러 현재 영상 뒤에 재생할 영상을 예약합니다.</small>
        </span>
        <input id="nextQueueToggle" type="checkbox" checked>
      </label>

      <section class="mute-log-section" aria-label="다음 재생 큐">
        <div class="mute-log-header">
          <strong>다음 재생 큐</strong>
          <button id="clearNextQueueButton" type="button">비우기</button>
        </div>
        <ol id="nextQueueList" class="mute-log-list"></ol>
      </section>

      <section class="mute-log-section" aria-label="최근 자동 음소거 차단 기록">
        <div class="mute-log-header">
          <strong>최근 차단 기록</strong>
          <button id="clearMuteLogsButton" type="button">지우기</button>
        </div>
        <ol id="muteLogList" class="mute-log-list"></ol>
      </section>

      <button id="resetButton" class="reset" type="button">기본값으로 복원</button>
      <p id="status" class="status" aria-live="polite"></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
